<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Notifications Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 { color: #333; margin-bottom: 30px; font-size: 28px; }
        .section { margin-bottom: 30px; }
        .section h2 { color: #667eea; font-size: 16px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .section p { color: #666; line-height: 1.6; margin-bottom: 10px; font-size: 14px; }
        .btn { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; margin-right: 10px; margin-bottom: 10px; transition: background 0.3s; }
        .btn:hover { background: #764ba2; }
        .btn-secondary { background: #ccc; color: #333; }
        .btn-secondary:hover { background: #bbb; }
        .status { padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
        .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .output { background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; padding: 15px; font-family: 'Courier New', monospace; font-size: 12px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
        .stat-box { background: #f9f9f9; border-left: 4px solid #667eea; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
        .stat-label { color: #999; font-size: 12px; text-transform: uppercase; }
        .stat-value { color: #333; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔔 HRMS Notifications Test</h1>
        
        <div class="section">
            <h2>📬 Notifications Status</h2>
            <div id="status">Not started</div>
            <div id="output" class="output"></div>
        </div>

        <div class="section">
            <h2>Actions</h2>
            <button class="btn" onclick="testNotifications()">Test Notifications</button>
            <button class="btn" onclick="testWFH()">Test WFH Integration</button>
            <button class="btn btn-secondary" onclick="clearOutput()">Clear</button>
        </div>

        <div class="section">
            <h2>💡 Quick Info</h2>
            <p><strong>Frontend:</strong> http://localhost:5174</p>
            <p><strong>API:</strong> http://localhost:8096</p>
            <p><strong>Database:</strong> MongoDB (hrms)</p>
            <p><strong>User:</strong> admin@hrms.com / password123</p>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const status = document.getElementById('status');

        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✓' : 'ℹ';
            output.textContent += `[${timestamp}] ${prefix} ${msg}\n`;
            output.scrollTop = output.scrollHeight;
            
            if (type === 'error') status.innerHTML = '<div class="status error">Error: Check notifications</div>';
            else if (type === 'success') status.innerHTML = '<div class="status success">✓ Notifications working!</div>';
        }

        async function testNotifications() {
            log('Starting notification test...');
            try {
                const response = await fetch('/api/notifications.php', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    log(`API returned ${response.status}`, 'error');
                    if (response.status === 401) {
                        log('Not authenticated - open login page first', 'error');
                    }
                    return;
                }

                const data = await response.json();
                if (data.success) {
                    const notifs = data.data.notifications || [];
                    const unread = data.data.unread_count || 0;
                    log(`Fetched ${notifs.length} notifications (${unread} unread)`, 'success');
                    
                    if (notifs.length > 0) {
                        notifs.slice(0, 3).forEach((n, i) => {
                            log(`${i+1}. ${n.title} - ${n.message.substring(0, 50)}...`);
                        });
                    }
                } else {
                    log(`API error: ${data.message}`, 'error');
                }
            } catch (err) {
                log(`Error: ${err.message}`, 'error');
            }
        }

        async function testWFH() {
            log('Starting WFH test...');
            try {
                const response = await fetch('/api/wfh.php', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    log(`API returned ${response.status}`, 'error');
                    return;
                }

                const data = await response.json();
                if (data.success) {
                    const wfh = Array.isArray(data.data) ? data.data : [];
                    log(`WFH API working - ${wfh.length} requests found`, 'success');
                    if (wfh.length > 0) {
                        wfh.slice(0, 3).forEach((w, i) => {
                            log(`${i+1}. ${w.start_date} to ${w.end_date} - ${w.status}`);
                        });
                    }
                } else {
                    log(`API error: ${data.message}`, 'error');
                }
            } catch (err) {
                log(`Error: ${err.message}`, 'error');
            }
        }

        function clearOutput() {
            output.textContent = '';
            status.innerHTML = '<div class="status info">Ready</div>';
        }

        // Auto test on load
        log('Page loaded');
        log('Open login page at http://localhost:5174 and log in first');
        log('Then click "Test Notifications" button to check');
    </script>
</body>
</html>
