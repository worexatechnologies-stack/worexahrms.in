# Replace /srv/hrms and the hostnames for the target environment.

<VirtualHost *:80>
    ServerName hrms.example.com
    Redirect permanent / https://hrms.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName hrms.example.com
    DocumentRoot /srv/hrms/dist

    SSLEngine on
    # SSLCertificateFile and SSLCertificateKeyFile are environment-specific.

    <Directory /srv/hrms/dist>
        AllowOverride FileInfo Options
        Options -Indexes
        Require all granted
    </Directory>

    Alias /api/ /srv/hrms/api/
    <Directory /srv/hrms/api>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    # Secrets belong in the PHP-FPM/service environment, not this file.
</VirtualHost>
